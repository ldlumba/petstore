spring:
  application:
    name: petstore-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:petstore}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:petstore}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:petstore}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
management:
  endpoints:
    web:
      exposure:
        include: health,info
