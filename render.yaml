services:
  - type: web
    name: petstore-backend
    runtime: docker
    rootDir: backend
    branch: render-deploy
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:5174,http://localhost:5175
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: petstore-frontend
    runtime: docker
    rootDir: frontend
    branch: render-deploy
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com

databases:
  - name: petstore-db
    databaseName: petstore
    user: petstore
    plan: free
    ipAllowList: []
