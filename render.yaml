services:
  - type: web
    name: petstore-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: petstore-frontend
          type: web
          property: hostport
      
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: $PORT

  - type: web
    name: petstore-frontend
    env: docker
    rootDir: frontend
    plan: free
    envVars:
      
      - key: VITE_API_BASE_URL
        fromService:
          name: petstore-backend
          type: web
          property: hostport

  - type: pserv
    name: petstore-db
    plan: free
    runtime: image
    startCommand: ""
    image:
      url: postgres:15-alpine
    envVars:
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_USER
        value: petstore
      - key: POSTGRES_DB
        value: petstore
